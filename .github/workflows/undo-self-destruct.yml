
name: Revert Repository

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Commit SHA to restore repository to"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: repository-restore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Validate SHA
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          if [[ ! "$TARGET_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "Invalid commit SHA"
            exit 1
          fi

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.REPO_TOKEN }}

      - name: Validate Target Commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          git cat-file -e "$TARGET_SHA^{commit}"

      - name: Restore Repository
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git rm -r --ignore-unmatch .
          git checkout "$TARGET_SHA" -- .

          if git diff --cached --quiet; then
            echo "Repository already matches target commit."
            exit 0
          fi

          git commit -m "chore: restore repository to $TARGET_SHA"

      - name: Push Restore Commit
        run: |
          git push origin "HEAD:${GITHUB_REF_NAME}"
